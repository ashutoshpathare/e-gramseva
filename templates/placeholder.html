{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-md-4 pt-2">
  <div class="card" style="max-width:560px;">
    <div class="card-header">{{ title }}</div>
    <div class="card-body">
      <p class="mb-2">
        Authentication is working. Logged in as
        <strong>{{ session['full_name'] }}</strong>
        {% if session.get('ward') %}&mdash; {{ session['ward'] }}{% endif %}.
      </p>
      <p class="text-muted mb-0" style="font-size:0.875rem;">
        Coming next: <em>{{ next_step }}</em>
      </p>
    </div>
  </div>
</div>
{% endblock %}
